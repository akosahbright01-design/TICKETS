<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>25/26 CoDE NSS Send-Off Dinner Night — Nomination Form</title>
<style>
:root{--navy:#0b1533;--navy2:#16245a;--gold:#e8bd5b;--gold2:#ffd98a;--ink:#f4f6ff;--mute:#9aa6cf;--line:rgba(255,255,255,.14);--err:#ff7a8a}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,#070d22,var(--navy) 45%,#1b1450);background-attachment:fixed;display:flex;justify-content:center;padding:28px 14px 60px;overflow-x:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;animation:float 14s ease-in-out infinite}
.o1{width:320px;height:320px;background:#e8bd5b;top:-90px;left:-80px}
.o2{width:380px;height:380px;background:#5b6cff;bottom:-120px;right:-100px;animation-delay:-5s}
.o3{width:220px;height:220px;background:#c04bff;top:45%;left:60%;opacity:.2;animation-delay:-9s}
@keyframes float{50%{transform:translate(30px,-40px) scale(1.12)}}
.card{position:relative;z-index:1;width:100%;max-width:560px;background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:34px 26px 30px;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:rise .8s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}}
.badge{display:inline-block;font-size:12px;letter-spacing:2px;font-weight:700;color:var(--navy);background:linear-gradient(90deg,var(--gold),var(--gold2));padding:6px 14px;border-radius:99px}
h1{font-size:clamp(26px,6vw,34px);line-height:1.15;margin:16px 0 6px;font-weight:800}
h1 span{background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:15px;margin-bottom:26px}
.field{position:relative;z-index:1;margin-bottom:20px;animation:rise .7s backwards}
.field:nth-of-type(1){animation-delay:.15s}.field:nth-of-type(2){animation-delay:.25s}.field:nth-of-type(3){animation-delay:.35s}.field:nth-of-type(4){animation-delay:.45s}
.lbl{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
.lbl i{color:var(--err);font-style:normal}
input[type=text],textarea,.trigger{width:100%;background:rgba(10,18,50,.55);border:1.5px solid var(--line);color:var(--ink);font:inherit;font-size:16px;padding:15px 16px;border-radius:14px;outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
textarea{resize:vertical;min-height:110px;line-height:1.5}
input::placeholder,textarea::placeholder{color:#6f7aa6}
input:focus,textarea:focus,.trigger:focus-visible,.dd.open .trigger{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,189,91,.18)}
.dd{position:relative}
.trigger{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;text-align:left}
.trigger .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#7d88b4}
.trigger .val.set{color:var(--ink);font-weight:600}
.chev{flex:none;width:20px;height:20px;transition:transform .4s cubic-bezier(.3,1.4,.5,1);color:var(--gold)}
.dd.open .chev{transform:rotate(180deg)}
.menu{list-style:none;position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:20;max-height:min(60vh,380px);overflow-y:auto;padding:8px;background:#ffffff;border:2px solid var(--gold);border-radius:18px;box-shadow:0 28px 60px rgba(0,0,0,.6);opacity:0;visibility:hidden;transform:translateY(-12px) scale(.96);transform-origin:top;transition:opacity .25s,transform .35s cubic-bezier(.2,1.2,.4,1),visibility 0s .35s}
.dd.open .menu{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.menu li{position:relative;display:flex;align-items:center;gap:14px;padding:15px 14px;margin:0;font-size:16px;font-weight:700;line-height:1.3;letter-spacing:.2px;color:#0b1533;cursor:pointer;border-radius:12px;border-bottom:1px solid #e6eaf5;opacity:0;transform:translateX(-14px);transition:background .2s,color .2s}
.menu li:last-child{border-bottom:0}
.dd.open .menu li{opacity:1;transform:none;transition:opacity .35s calc(var(--i)*28ms),transform .4s calc(var(--i)*28ms),background .2s,color .2s}
.menu li::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid #b8891f;transition:transform .25s}
.menu li:hover,.menu li.act{background:#0f1f55;color:#fff}
.menu li:hover::before,.menu li.act::before{transform:scale(1.35);background:var(--gold2)}
.menu li.sel{background:#fff4d6;color:#0b1533}
.menu li.sel::after{content:"\2713";margin-left:auto;font-size:18px;font-weight:900;color:#b8891f}
.menu li.sel:hover,.menu li.sel.act{background:#0f1f55;color:#fff}
.menu li.sel:hover::after,.menu li.sel.act::after{color:var(--gold2)}
.menu::-webkit-scrollbar{width:8px}.menu::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.field.up{z-index:30}
.trigger,.menu li{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.err{color:var(--err);font-size:13px;margin-top:6px;min-height:0;max-height:0;opacity:0;overflow:hidden;transition:.3s}
.field.bad .err{max-height:30px;opacity:1}
.field.bad input,.field.bad .trigger{border-color:var(--err);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hp{position:absolute;left:-9999px;opacity:0}
button.go{width:100%;border:0;cursor:pointer;margin-top:6px;padding:17px;border-radius:16px;font:inherit;font-size:16px;font-weight:800;letter-spacing:1px;color:var(--navy);background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));background-size:200% 100%;transition:transform .2s,box-shadow .3s,background-position .6s;box-shadow:0 10px 30px rgba(232,189,91,.35);display:flex;justify-content:center;align-items:center;gap:10px}
button.go:hover{background-position:100% 0;transform:translateY(-2px);box-shadow:0 16px 36px rgba(232,189,91,.5)}
button.go:active{transform:scale(.98)}
button.go:disabled{opacity:.7;cursor:wait}
.spin{width:18px;height:18px;border:3px solid rgba(11,21,51,.25);border-top-color:var(--navy);border-radius:50%;animation:sp .7s linear infinite;display:none}
.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{margin-top:14px;font-size:14px;color:var(--err);text-align:center;display:none}
.done{display:none;text-align:center;padding:30px 6px 10px}
.done.show{display:block;animation:rise .7s both}
.ring{width:96px;height:96px;margin:0 auto 20px}
.ring circle{fill:none;stroke:var(--gold);stroke-width:4;stroke-dasharray:290;stroke-dashoffset:290;animation:draw .8s .1s forwards}
.ring path{fill:none;stroke:var(--gold2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .8s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{font-size:26px;margin-bottom:8px}.done p{color:var(--mute);line-height:1.6;margin-bottom:22px}
.again{background:none;border:1.5px solid var(--gold);color:var(--gold);padding:12px 26px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer;transition:.25s}
.again:hover{background:var(--gold);color:var(--navy)}
.toast{position:fixed;left:50%;top:18px;z-index:1000;max-width:92vw;transform:translate(-50%,-140%);background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--navy);font-weight:800;font-size:15px;text-align:center;padding:14px 22px;border-radius:99px;box-shadow:0 14px 40px rgba(0,0,0,.45);transition:transform .55s cubic-bezier(.2,1.3,.4,1)}
.toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<main class="card">
  <div id="formWrap">
    <span class="badge">25/26 · CoDE NSS</span>
    <h1>Send-Off <span>Dinner Night</span></h1>
    <p class="sub">Award Nomination Form — tell us who deserves the spotlight.</p>

    <form id="f" novalidate>
      <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off">

      <div class="field" id="fName">
        <label class="lbl" for="nominee">Nominee Name <i>*</i></label>
        <input type="text" id="nominee" placeholder="Type the nominee's full name" autocomplete="off">
        <div class="err">Please type the nominee's name.</div>
      </div>

      <div class="field" id="fAward">
        <span class="lbl">Award Categories <i>*</i></span>
        <div class="dd" id="ddAward"></div>
        <div class="err">Please choose an award category.</div>
      </div>

      <div class="field" id="fDept">
        <span class="lbl">Best Department <i>*</i></span>
        <div class="dd" id="ddDept"></div>
        <div class="err">Please choose a department.</div>
      </div>

      <div class="field" id="fIdeas">
        <label class="lbl" for="ideas">Any ideas for the dinner?</label>
        <textarea id="ideas" placeholder="Menu, theme, dress code, games, music, entertainment… share anything!"></textarea>
      </div>

      <button type="submit" class="go" id="go"><span class="spin"></span><span id="goTxt">SUBMIT NOMINATION</span></button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

</main>
<div class="toast" id="toast" role="status">🎉 Congratulations! Your nomination has been received.</div>

<script>
/* ===== SETTINGS ===== */
const SEND_TO = "akosahbright01@gmail.com";
const API = "/api/submit"; /* our own Gmail backend (api/submit.js) */
async function sendToServer(fields){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({form:'nomination',fields})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok) throw new Error(j.error||'Failed');
}

const AWARDS = ["MOST FASHIONABLE","BEST PALS","MOST HARDWORKING","MOST CHARISMATIC PERSONNEL"];
const DEPTS = ["GENERAL OFFICE","OFFICE OF THE COLLEGE FINANCE OFFICER","ACCOUNT SECTION (PAYMENT)","ACCOUNT SECTION (FINAL ACCOUNT)","STUDENTS FEE ACCOUNTS OFFICE","PAYROLL OFFICE","STORES","DEPARTMENT OF EDUCATION PROGRAMMES","DEPARTMENT OF BUSINESS PROGRAMMES","DEPARTMENT OF MATHEMATICS AND SCIENCE PROGRAMMES","DEPARTMENT OF ARTS AND SOCIAL SCIENCES PROGRAMMES","POST GRADUATE STUDIES UNIT","QUALITY ASSURANCE AND ENHANCEMENT UNIT","ADMISSIONS UNIT","STUDENTS' SUPPORT SERVICES & COUNSELLING UNIT","SWITCH OFFICE","EXAMINATION SECTION","STUDENTS' RECORDS MANAGEMENT SECTION","TEACHING PRACTICE UNIT","REPROGRAPHIC, PRODUCTION AND DISPATCH SECTION","E-LEARNING UNIT"];

/* ===== Animated dropdown ===== */
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function dropdown(root, placeholder, items){
  root.innerHTML = '<button type="button" class="trigger" aria-haspopup="listbox" aria-expanded="false"><span class="val">'+placeholder+'</span>'+CHEV+'</button><ul class="menu" role="listbox"></ul>';
  const btn=root.querySelector('.trigger'), val=root.querySelector('.val'), menu=root.querySelector('.menu');
  let value="", idx=-1;
  items.forEach((t,i)=>{const li=document.createElement('li');li.textContent=t;li.setAttribute('role','option');li.style.setProperty('--i',i);li.onclick=()=>pick(i);menu.appendChild(li)});
  const lis=[...menu.children];
  const setAct=i=>{idx=i;lis.forEach((l,k)=>l.classList.toggle('act',k===i));if(i>=0)lis[i].scrollIntoView({block:'nearest'})};
  const field=root.closest('.field');
  const open=o=>{document.querySelectorAll('.dd.open').forEach(d=>{if(d!==root){d.classList.remove('open');d.closest('.field').classList.remove('up')}});root.classList.toggle('open',o);field.classList.toggle('up',o);btn.setAttribute('aria-expanded',o);
    if(o)setTimeout(()=>{const r=menu.getBoundingClientRect(),vh=window.innerHeight;if(r.bottom>vh-12)window.scrollBy({top:r.bottom-vh+24,behavior:'smooth'})},60)};
  function pick(i){value=items[i];val.textContent=value;val.classList.add('set');lis.forEach((l,k)=>l.classList.toggle('sel',k===i));root.closest('.field').classList.remove('bad');open(false);btn.focus()}
  btn.onclick=e=>{e.stopPropagation();open(!root.classList.contains('open'))};
  btn.onkeydown=e=>{
    const o=root.classList.contains('open');
    if(e.key==='ArrowDown'){e.preventDefault();if(!o)open(true);setAct(Math.min(idx+1,items.length-1))}
    else if(e.key==='ArrowUp'){e.preventDefault();if(!o)open(true);setAct(Math.max(idx-1,0))}
    else if((e.key==='Enter'||e.key===' ')&&o&&idx>=0){e.preventDefault();pick(idx)}
    else if(e.key==='Escape')open(false);
  };
  menu.onclick=e=>e.stopPropagation();
  return {get:()=>value, reset:()=>{value="";val.textContent=placeholder;val.classList.remove('set');lis.forEach(l=>l.classList.remove('sel'));setAct(-1)}};
}
document.addEventListener('click',()=>document.querySelectorAll('.dd.open').forEach(d=>{d.classList.remove('open');d.closest('.field').classList.remove('up')}));

const award = dropdown(document.getElementById('ddAward'),'Tap to choose a category',AWARDS);
const dept  = dropdown(document.getElementById('ddDept'),'Tap to choose a department',DEPTS);

/* ===== Celebration emoji burst ===== */
function celebrate(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎉','🎊','🥳','🏆','👏','✨','🎓','🌟','🍾','🎈','💛','🎶'];
  const layer=document.createElement('div');
  layer.style.cssText='position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:999';
  document.body.appendChild(layer);
  const W=window.innerWidth,H=window.innerHeight;
  const spawn=(x,y,dx,up,delay,size)=>{
    const s=document.createElement('span');
    s.textContent=E[Math.floor(Math.random()*E.length)];
    s.style.cssText='position:absolute;left:0;top:0;font-size:'+size+'px;will-change:transform,opacity';
    layer.appendChild(s);
    const rot=(Math.random()*720-360)|0;
    s.animate([
      {transform:`translate(${x}px,${y}px) scale(.2) rotate(0deg)`,opacity:0},
      {transform:`translate(${x+dx*.5}px,${y-up}px) scale(1.2) rotate(${rot/2}deg)`,opacity:1,offset:.35},
      {transform:`translate(${x+dx}px,${H+60}px) scale(1) rotate(${rot}deg)`,opacity:1}
    ],{duration:2600+Math.random()*1400,delay,easing:'cubic-bezier(.2,.7,.4,1)',fill:'both'});
  };
  /* sprout up from both bottom corners */
  for(let i=0;i<34;i++){
    const d=Math.random()*450;
    spawn(30,H-20,40+Math.random()*W*.6,H*(.45+Math.random()*.4),d,22+Math.random()*22);
    spawn(W-30,H-20,-(40+Math.random()*W*.6),H*(.45+Math.random()*.4),d,22+Math.random()*22);
  }
  /* bottom-centre fountain */
  for(let i=0;i<22;i++) spawn(W/2,H-20,(Math.random()-.5)*W*.9,H*(.55+Math.random()*.35),200+Math.random()*500,24+Math.random()*24);
  /* gentle rain from the top */
  for(let i=0;i<26;i++){
    const x=Math.random()*W;
    spawn(x,-40,(Math.random()-.5)*120,-30,600+Math.random()*1300,20+Math.random()*18);
  }
  setTimeout(()=>layer.remove(),6500);
}

/* ===== Submit ===== */
const $=id=>document.getElementById(id), f=$('f'), go=$('go'), msg=$('msg');
$('nominee').addEventListener('input',()=>$('fName').classList.remove('bad'));

f.addEventListener('submit', async e=>{
  e.preventDefault(); msg.style.display='none';
  const name=$('nominee').value.trim();
  const bad=(id,c)=>{$(id).classList.toggle('bad',c);return c};
  const errs=[bad('fName',!name),bad('fAward',!award.get()),bad('fDept',!dept.get())];
  if(errs.some(Boolean)) return;
  if(f._honey && f._honey.value) return;

  go.disabled=true; go.classList.add('loading'); $('goTxt').textContent='SENDING…';
  const payload={
    "Nominee Name":name,
    "Award Category":award.get(),
    "Best Department":dept.get(),
    "Ideas for the Dinner":$('ideas').value.trim()||"(none given)",
    "_subject":"New Nomination — 25/26 CoDE NSS Send-Off Dinner Night",
    "_template":"table",
    "_captcha":"false"
  };
  try{
    await sendToServer(Object.fromEntries(Object.entries(payload).filter(([k])=>k[0]!=='_')));
    /* success: reset the page to its default state + celebrate */
    f.reset(); award.reset(); dept.reset();
    document.querySelectorAll('.field').forEach(x=>x.classList.remove('bad'));
    window.scrollTo({top:0,behavior:'smooth'});
    celebrate();
    const t=$('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),4500);
  }catch(err){
    const body='Nominee Name: '+payload['Nominee Name']+'\nAward Category: '+payload['Award Category']+'\nBest Department: '+payload['Best Department']+'\nIdeas for the Dinner: '+payload['Ideas for the Dinner'];
    const mailto='mailto:'+SEND_TO+'?subject='+encodeURIComponent(payload._subject)+'&body='+encodeURIComponent(body);
    msg.innerHTML='Could not send automatically right now. Check your internet and try again, or <a href="'+mailto+'" style="color:var(--gold2);font-weight:800;text-decoration:underline">tap here to send it by email instead</a>.';
    msg.style.display='block';
  }finally{
    go.disabled=false; go.classList.remove('loading'); $('goTxt').textContent='SUBMIT NOMINATION';
  }
});
</script>
</body>
</html>
